<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Inter, DejaVu Sans, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/>
    </marker>
    <style>
      .t{font-size:17px;font-weight:600;fill:#0f172a}
      .s{font-size:13.5px;fill:#475569}
      .m{font-family:'DejaVu Sans Mono',monospace;font-size:13px;fill:#334155}
      .zone{font-size:14px;font-weight:700;letter-spacing:1.5px;fill:#64748b}
      .box{fill:#ffffff;stroke:#cbd5e1;stroke-width:1.5}
      .hot{fill:#fff7ed;stroke:#fdba74;stroke-width:1.5}
      .ln{stroke:#475569;stroke-width:2;fill:none}
      .lh{stroke:#c2410c;stroke-width:2.2;fill:none}
      .pl{fill:none;stroke:#0f766e;stroke-width:1.6;stroke-dasharray:7 5}
      .plt{font-size:13px;font-weight:600;fill:#0f766e}
    </style>
  </defs>

  <rect width="1600" height="900" fill="#f8fafc"/>
  <text x="40" y="48" font-size="26" font-weight="700" fill="#0f172a">Real-time Wikipedia lakehouse on Microsoft Fabric</text>
  <text x="40" y="76" class="s" font-size="15">Live change events and a bulk load, from open data to natural-language questions</text>

  <!-- zones -->
  <rect x="24" y="100" width="250" height="770" rx="14" fill="#fefce8" stroke="#fde68a"/>
  <text x="44" y="128" class="zone">OPEN DATA</text>
  <rect x="290" y="100" width="230" height="430" rx="14" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="310" y="128" class="zone">LAPTOP</text>
  <rect x="536" y="100" width="1040" height="770" rx="14" fill="#f0fdfa" stroke="#99f6e4"/>
  <text x="556" y="128" class="zone">MICROSOFT FABRIC</text>

  <!-- sources -->
  <rect x="44" y="300" width="210" height="92" rx="10" class="box"/>
  <text x="60" y="330" class="t">Wikimedia</text>
  <text x="60" y="352" class="t">EventStreams</text>
  <text x="60" y="376" class="s">every edit, live (SSE)</text>

  <rect x="44" y="700" width="210" height="92" rx="10" class="box"/>
  <text x="60" y="730" class="t">NYC TLC trips</text>
  <text x="60" y="754" class="s">one Parquet file</text>
  <text x="60" y="774" class="s">per month</text>

  <!-- producer -->
  <rect x="306" y="276" width="198" height="140" rx="10" class="box"/>
  <text x="322" y="306" class="t">Python producer</text>
  <text x="322" y="330" class="s">flat, versioned JSON</text>
  <text x="322" y="351" class="s">no names, IPs, comments</text>
  <text x="322" y="372" class="s">Last-Event-ID resume</text>
  <text x="322" y="393" class="s">batching + retries</text>

  <!-- eventstream -->
  <rect x="556" y="290" width="210" height="112" rx="10" class="box"/>
  <text x="572" y="320" class="t">Eventstream</text>
  <text x="572" y="344" class="s">custom endpoint</text>
  <text x="572" y="365" class="s">(Event Hubs protocol)</text>
  <text x="572" y="386" class="m">es_wiki_edits</text>

  <!-- hot path -->
  <rect x="820" y="150" width="250" height="100" rx="10" class="hot"/>
  <text x="836" y="180" class="t">Eventhouse (KQL)</text>
  <text x="836" y="204" class="m">WikiEdits</text>
  <text x="836" y="228" class="s">queryable in ~4 s (p50)</text>

  <rect x="1120" y="150" width="250" height="100" rx="10" class="hot"/>
  <text x="1136" y="180" class="t">KQL queryset</text>
  <text x="1136" y="204" class="s">edits per minute, hot pages,</text>
  <text x="1136" y="225" class="s">anomaly detection, latency</text>

  <text x="1390" y="196" font-size="13" font-weight="700" fill="#c2410c">HOT PATH</text>
  <text x="1390" y="215" class="s">seconds</text>

  <!-- cold path -->
  <rect x="820" y="318" width="190" height="96" rx="10" class="box"/>
  <text x="836" y="348" class="t">Lakehouse</text>
  <text x="836" y="372" class="m">bronze_wiki_edits</text>
  <text x="836" y="394" class="s">Delta, append</text>

  <rect x="1048" y="292" width="236" height="152" rx="10" class="box"/>
  <text x="1064" y="324" class="t">nb_10 · silver</text>
  <text x="1064" y="346" class="s">stream (availableNow) + MERGE</text>
  <text x="1064" y="372" class="m">silver_wiki_edits</text>
  <text x="1064" y="390" class="s">history, exactly once</text>
  <text x="1064" y="412" class="m">silver_page_latest</text>
  <text x="1064" y="430" class="s">latest by revision</text>

  <rect x="1316" y="306" width="236" height="120" rx="10" class="box"/>
  <text x="1332" y="334" class="t">nb_20 · gold</text>
  <text x="1332" y="356" class="s">replaceWhere window</text>
  <text x="1332" y="382" class="m">gold_wiki_hourly</text>
  <text x="1332" y="404" class="m">gold_top_pages_daily</text>

  <rect x="1048" y="488" width="236" height="66" rx="10" class="box"/>
  <text x="1064" y="514" class="t">nb_30 · quality gate</text>
  <text x="1064" y="538" class="s">5 checks, fails the run</text>

  <rect x="1032" y="282" width="536" height="286" rx="14" class="pl"/>
  <text x="1046" y="586" class="plt">pl_wiki_lakehouse · hourly · retries · idempotent</text>

  <text x="836" y="470" font-size="13" font-weight="700" fill="#334155">COLD PATH</text>
  <text x="836" y="489" class="s">curated history</text>

  <!-- AI -->
  <rect x="1316" y="636" width="236" height="110" rx="10" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1.5"/>
  <text x="1332" y="666" class="t">Fabric Data Agent</text>
  <text x="1332" y="690" class="s">natural-language questions</text>
  <text x="1332" y="711" class="s">over gold, silver and taxi</text>
  <text x="1332" y="732" class="s">answered with T-SQL</text>

  <!-- bulk path -->
  <rect x="556" y="700" width="230" height="92" rx="10" class="box"/>
  <text x="572" y="730" class="t">nb_40 · bulk load</text>
  <text x="572" y="752" class="s">month = chunk, replaceWhere</text>
  <text x="572" y="773" class="s">ingest log → resumable</text>
  <rect x="544" y="688" width="254" height="116" rx="14" class="pl"/>
  <text x="556" y="824" class="plt">pl_nyc_taxi_bulk · manual</text>

  <rect x="840" y="700" width="230" height="92" rx="10" class="box"/>
  <text x="856" y="730" class="t">Lakehouse</text>
  <text x="856" y="754" class="m">bronze_nyc_taxi_trips</text>
  <text x="856" y="776" class="s">~20 M rows, 6 months</text>

  <!-- arrows -->
  <path d="M254 346 H300" class="ln" marker-end="url(#a)"/>
  <path d="M504 346 H550" class="ln" marker-end="url(#a)"/>
  <path d="M766 330 C795 330 790 200 814 200" class="lh" marker-end="url(#h)"/>
  <path d="M766 362 H814" class="ln" marker-end="url(#a)"/>
  <path d="M1070 200 H1114" class="lh" marker-end="url(#h)"/>
  <path d="M1010 366 H1042" class="ln" marker-end="url(#a)"/>
  <path d="M1284 366 H1310" class="ln" marker-end="url(#a)"/>
  <path d="M1163 444 V482" class="ln" marker-end="url(#a)"/>
  <path d="M1434 426 V630" class="ln" marker-end="url(#a)"/>
  <path d="M254 746 H550" class="ln" marker-end="url(#a)"/>
  <path d="M786 746 H834" class="ln" marker-end="url(#a)"/>
  <path d="M1070 746 C1190 746 1190 700 1310 700" class="ln" marker-end="url(#a)"/>
</svg>
